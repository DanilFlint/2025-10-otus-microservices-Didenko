# 2. ConfigMap для настроек подключения к Helm-релизу
# Предполагаем, что имя релиза Helm — "db"
# Тогда внутренний DNS адрес будет: db-postgresql.default.svc.cluster.local
apiVersion: v1
kind: ConfigMap
metadata:
  name: ok-app-config
data:
  # Хост формируется как {release-name}-postgresql
  DB_URL: "jdbc:postgresql://db-postgresql:5432/mydatabase"
  DB_HOST: "db-postgresql"
  DB_PORT: "5432"
  DB_NAME: "mydatabase"
  DB_USERNAME: "user"
  DB_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"