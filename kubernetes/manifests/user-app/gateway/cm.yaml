apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  application.yaml: |
    spring:
      cloud:
        gateway:
          server:
            webflux:
              routes:
              - id: users_route
                uri: http://user-service:8000
                predicates:
                - Path=/api/v1/users/**
                filters:
                - name: AuthenticationFilter
              - id: auth_route
                uri: http://auth-service:8088
                predicates:
                - Path=/api/v1/auth/**
    services:
      auth:
        base-url: "http://auth-service:8088"
        validate-path: "/api/v1/auth/validate"