apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-dp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: danilflint/gateway:1.0
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: config-volume
        configMap:
          name: gateway-config