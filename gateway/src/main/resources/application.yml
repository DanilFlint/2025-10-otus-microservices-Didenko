spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: users_route
            uri: http://127.0.0.1:8000
            predicates:
            - Path=/api/v1/users/**
            filters:
              - name: AuthenticationFilter
          - id: auth_route
            uri: http://127.0.0.1:8088
            predicates:
            - Path=/api/v1/auth/**
server:
  port: 9000
services:
  auth:
    base-url: "http://127.0.0.1:8088"
    validate-path: "/api/v1/auth/validate"
